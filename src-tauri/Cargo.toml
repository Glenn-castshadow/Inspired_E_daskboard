[package]
name = "etsy-dashboard"
version = "0.1.9"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["api-all"] }

# HTTP client — async, JSON support
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Secure OS keyring storage for API keys and OAuth tokens
keyring = "2"

# Etsy OAuth 2.0 + PKCE
rand = "0.8"
base64 = "0.21"
sha2 = "0.10"
chrono = "0.4"

# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
