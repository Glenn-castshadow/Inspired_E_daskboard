[package]
name = "etsy-dashboard"
version = "0.1.18"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["api-all", "devtools"] }

# HTTP client — async, JSON support
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Secure OS keyring storage for API keys and OAuth tokens
keyring = "2"

# Etsy OAuth 2.0 + PKCE
rand = "0.8"
base64 = "0.21"
sha2 = "0.10"
chrono = "0.4"

# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }

# Credentials export/import — encrypted with passphrase
aes-gcm = "0.10"
pbkdf2 = "0.12"

[features]
# Required by `cargo tauri build` — propagates to tauri's custom-protocol feature
# which is needed for production builds (loads frontend from bundled assets
# instead of the dev server). Do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
