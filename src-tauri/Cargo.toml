[package]
name = "etsy-dashboard"
version = "0.1.94"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }

# Tauri v2 plugin: open URLs from Rust (used by Etsy OAuth to launch the browser).
tauri-plugin-shell = "2"

# HTTP client — async, JSON support
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# join_all — fetch all shops concurrently (already present transitively)
futures-util = "0.3"

# Secure OS keyring storage for API keys and OAuth tokens
keyring = "2"

# Etsy OAuth 2.0 + PKCE
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"
sha2 = "0.10"
chrono = "0.4"

# SQLite cache
rusqlite = { version = "0.31", features = ["bundled"] }

# Credentials export/import — encrypted with passphrase
aes-gcm = "0.10"
pbkdf2 = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
